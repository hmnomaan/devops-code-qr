apiVersion: apps/v1
kind: Deployment
metadata:
  name: qr-frontend
spec:
  # Modify replicas according to your case
  replicas: 2
  selector:
    matchLabels:
      app: qr-frontend
  template:
    metadata:
      labels:
        app: qr-frontend
  # Modify container details according to your case
    spec:
      containers:
      - name: qr-frontend
        image: hmnomaan0/devops-qr-code-frontend:latest
        ports:
        - containerPort: 3000

---
  apiVersion: v1
  kind: Service
  metadata:
    name: qr-frontend-service
  spec:
    type: LoadBalancer
    selector:
      app: qr-frontend
    ports:
      - protocol: TCP
        port: 80
        targetPort: 3000
